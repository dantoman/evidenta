# Contractul RLS — sursa unică de adevăr pentru gardianul de model (suita 2).
#
# Autoritate:  docs/decisions/003-rls-tenancy-tables.md
#              docs/specs/spec-a-tenancy.md §5.4
# Consumator:  backend/tests/schema_guard/
#
# Modificarea acestui fișier: DOUĂ feluri, și numai unul cere decizia proprietarului (ADR-072).
#
#   (a) LĂRGEȘTE ACCESUL  — ADR. Politică de altă formă decât `global_read_only` pe o tabelă de
#                           business; `writer_role` care scrie la runtime (`evidenta_refdata` ș.a.,
#                           adică o cale privilegiată); scoaterea sau slăbirea unei intrări
#                           existente; schimbarea formei unei politici deja aplicate pe date.
#   (b) NU LĂRGEȘTE       — commit obișnuit. O intrare NOUĂ, pentru o tabelă NOUĂ, cu toate trei
#                           deodată: `tenant_column = false`, `policy_shape = "global_read_only"`,
#                           `writer_role = "evidenta_owner"` — vocabular global doar-citire,
#                           însămânțat din migrarea care îl definește. `permission` e precedentul.
#
# `reason` și `source` sunt obligatorii pe ORICE intrare, din ambele clase: motivul spune ce e
# exceptat și PÂNĂ UNDE (OD-95), sursa spune cine a sancționat excepția.
#
# Nu se duplică în documentație: documentele trimit aici.
#
# Două lucruri distincte se declară mai jos, și confuzia dintre ele este exact greșeala pe care
# fișierul o previne:
#
#   tenant_column = false   — excepție de la R1 (tabela nu are coloană de context de tenant)
#   policy_shape  ≠ "tenant_scoped"
#                           — tabela ARE politică RLS, dar de altă formă decât șablonul
#   writer_role   = "…"     — singurul rol cu politici și privilegii de scriere pe tabelă
#                           (ADR-049). Absent = nimeni nu o scrie prin nicio politică.
#
# O tabelă poate fi în a doua categorie fără să fie în prima. `membership` are `tenant_id`, deci nu
# este excepție de la R1 — dar politica ei este `user_id = app.current_user_id()`, nu șablonul.
#
# Gardianul de model NU sare peste tabelele de aici. Verifică forma declarată. O tabelă cu politică
# lipsă eșuează chiar dacă e listată; o tabelă cu politică de altă formă decât cea declarată
# eșuează la fel.

schema_version = 1
updated = "2026-08-29"

# ── Forme de politică recunoscute ────────────────────────────────────────────
#
# tenant_scoped       șablonul din spec-a §2.5 — implicit, nu se declară
# company_scoped      șablonul din spec-a §2.6 (tenant + companie)
# self_row            rândurile propriului utilizator: user_id = app.current_user_id()
# tenant_predicate    rls.has_tenant_access(<coloana de identitate a tenantului>)
# engagement_parties  rls.can_see_engagement(client_tenant_id, firm_id)
# firm_parties        membru al tenantului firmei, sau tenant cu engagement viu asupra firmei
# global_read_only    citire liberă rolului de aplicație; scriere doar prin cale privilegiată —
#                     rolul care o scrie se declară cu `writer_role`, iar gardianul (IZ-78) refuză
#                     orice altă politică de scriere și orice privilegiu de scriere al aplicației
# platform_log        jurnal al platformei: scris de `writer_role`, fără NICIUN privilegiu pentru
#                     rolul de aplicație — nici citire (conține tenanți străini; spec-a §6.3)
# readmodel_firm      filtrare pe firm_id (spec-a §7.3); rolul de aplicație are doar SELECT
# system              tabelă de infrastructură, în afara domeniului RLS

# ── Globale: nu au proprietar ────────────────────────────────────────────────

[[table]]
name = "user"
tenant_column = false
policy_shape = "self_row"
reason = "Identitate globală: un contabil are un singur cont pentru toți clienții. Tabela nu conține niciun câmp de business — vezi spec-a §1.5."
source = "V2 §4.1; ADR-003"

[[table]]
name = "permission"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_owner"
reason = "Catalogul fix de permisiuni, același pentru toți: clientul compune roluri, nu permisiuni. Fără coloană de tenant tocmai pentru că nu aparține nimănui — vezi ADR-020. Scriitorul e rolul de migrare, nu cel de date de referință: catalogul e cod (ADR-020) și se însămânțează din migrarea care îl definește (`identity/0003`, politica din `0019`), deci ajunge în bază odată cu deploy-ul, nu printr-o încărcare."
source = "ADR-020; excepția este sancționată chiar de decizia care creează tabela"

[[table]]
name = "counterparty_registry"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Registru public după IDNO, alimentat din surse publice. Scriere prin calea privilegiată P-5."
source = "Amendament §C.1"

[[table]]
name = "fiscal_parameter"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Aceeași lege pentru toți. Scriere prin calea privilegiată P-4."
source = "Amendament §B.1; R15"

[[table]]
name = "fiscal_parameter_source"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Proveniența parametrilor: act normativ, Monitorul Oficial, dată publicare."
source = "Amendament §B.1"

[[table]]
name = "fiscal_parameter_confidence_event"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Istoricul încrederii în sursă: când o valoare a trecut de la dedusă la citită în act. Același fapt pentru toți tenanții — un istoric per tenant ar da răspunsuri diferite aceluiași control despre același act."
source = "ADR-046"

[[table]]
name = "calculation_invariant_domain"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_owner"
reason = "Unde se aplică un invariant de calcul: un rând per tip de raport acoperit. Domeniul e o MULȚIME, iar o cheie străină unică n-o poate exprima (ADR-071 §7.1, OD-106). Global din același motiv ca vocabularul pe care îl referă — distincția e a legii, aceeași pentru toți tenanții unei jurisdicții — și însămânțat din migrarea care îl definește. Excepția se oprește aici: rezultatele calculului sunt tenant-scoped, nu moștenesc nimic din rândul acesta."
source = "ADR-071 §7.1; regimul intrării — ADR-072 §2, clasa (b)"

[[table]]
name = "employment_relationship_type"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_owner"
reason = "Vocabular de trei valori impus de lege — contract individual de muncă, raporturi de serviciu în baza actului administrativ, contract civil (anexa nr. 1 la Legea nr. 489/1999, pct. 1.1 prima liniuță). Același pentru toți tenanții unei jurisdicții, însămânțat din migrarea care îl definește, ca `permission`. Excepția se oprește aici: nu se extinde la alte tabele ale modulului, iar tabelele care poartă raporturi de muncă ale unui tenant nu o moștenesc — ele au tenant_id."
source = "ADR-071; regimul intrării — ADR-072 §2, clasa (b)"

[[table]]
name = "fiscal_logic_version"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Registrul de selecție a implementărilor după dată efectivă."
source = "Amendament §A.4; R17"

[[table]]
name = "exchange_rate"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Curs BNM. Scriere prin calea privilegiată P-3."
source = "V2 §4.3"

[[table]]
name = "coa_template"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Template legislativ al planului de conturi SNC, versionat. Instanțiat per companie. Scriere prin calea privilegiată P-10."
source = "V2 §4.3, §7.1"

[[table]]
name = "coa_template_account"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Conturile template-ului. Instanțele companiilor sunt tenant-scoped."
source = "V2 §7.1"

[[table]]
name = "plan"
tenant_column = false
policy_shape = "global_read_only"
reason = "Catalogul comercial, versionat. Abonamentele care îl referă sunt tenant-scoped."
source = "spec-a §10.2"

[[table]]
name = "feature_flag"
tenant_column = false
policy_shape = "global_read_only"
reason = "Catalog tehnic. Atribuirea către tenant este `feature_flag_override`, tenant-scoped."
source = "spec-a §10.5"

[[table]]
name = "release_ring"
tenant_column = false
policy_shape = "global_read_only"
reason = "Catalog tehnic. Atribuirea este `tenant_release_ring`, tenant-scoped."
source = "spec-a §10.5"

[[table]]
name = "privileged_access_log"
tenant_column = false
policy_shape = "platform_log"
writer_role = "evidenta_refdata"
reason = "Jurnalul căilor privilegiate. Acoperă mai mulți tenanți prin construcție; citire rezervată administrării platformei — care nu are încă rol (DN-18), deci azi nimeni prin aplicație."
source = "spec-a §6.3; ADR-049"

# ── Actele normative și publicările lor (OD-65) ─────────────────────────────

[[table]]
name = "normative_act"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Registrul actelor citate de parametri și de planul de conturi. Aceeași lege pentru toți."
source = "ADR-049; R15"

[[table]]
name = "official_publication"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "O poziție din Monitorul Oficial. Entitate proprie fiindcă o poziție acoperă mai multe acte (MO 233-237 art. 1534 din 22.10.2013 — OMF 118 și OMF 119 din 2013)."
source = "ADR-049; OD-65"

[[table]]
name = "normative_act_publication"
tenant_column = false
policy_shape = "global_read_only"
writer_role = "evidenta_refdata"
reason = "Legătura act ↔ publicare, în ambele sensuri reale."
source = "ADR-049; OD-65"

# ── Rădăcina de tenancy ──────────────────────────────────────────────────────

[[table]]
name = "tenant"
tenant_column = false
policy_shape = "tenant_predicate"
identity_column = "id"
reason = "Este propriul context: nu poate avea un `tenant_id` care să refere altceva decât pe sine."
source = "ADR-003"

# ── Tabele care leagă doi tenanți ────────────────────────────────────────────

[[table]]
name = "firm"
tenant_column = true
policy_shape = "firm_parties"
reason = "Firma are tenant propriu, unde își ține propria contabilitate (spec-a §1.3), deci ARE tenant_id. Nu este excepție de la R1 — dar politica nu este șablonul: `firm` se vede și tenanților clienți cu engagement viu, nu doar membrilor tenantului ei."
source = "V2 §4.1; spec-a §1.3; corectat la F0.3.3 — vezi OD-45"

[[table]]
name = "engagement"
tenant_column = false
policy_shape = "engagement_parties"
reason = "Rândul leagă tenantul client de tenantul firmei. Niciunul dintre cele două nu e „contextul” lui; ambele părți îl văd."
source = "ADR-003"

# ── Au `tenant_id`, dar politică de altă formă ───────────────────────────────

[[table]]
name = "engagement_company_scope"
tenant_column = "client_tenant_id"
policy_shape = "tenant_predicate"
reason = "Poartă tenantul CLIENT, denormalizat, ca politica să decidă fără JOIN pe engagement — un JOIN acolo ar readuce recursiunea ruptă de ADR-003. Numele `tenant_id` ar sugera că rândul aparține tenantului din context, ceea ce nu înseamnă."
source = "spec-a §1.4; adăugat la F0.3.3 — vezi OD-45"

[[table]]
name = "engagement_module_scope"
tenant_column = false
policy_shape = "engagement_parties"
reason = "Atribut pur al engagementului: nu are tenant propriu, pentru că engagementul însuși leagă doi tenanți. Politica îl urmează prin EXISTS pe rândul părinte, care este el însuși protejat."
source = "spec-a §1.4; adăugat la F0.3.3 — vezi OD-45"

[[table]]
name = "mfa_method"
tenant_column = false
policy_shape = "self_row"
reason = "Al doilea factor apartine utilizatorului, nu tenantului: identitatea e globala (ADR-003), deci un contabil are un singur cont si un singur al doilea factor pentru toti clientii. Secretul e criptat cu o cheie din afara bazei."
source = "ADR-021; spec-a §1.5"

[[table]]
name = "mfa_backup_code"
tenant_column = false
policy_shape = "self_row"
reason = "Idem: codurile de recuperare apartin contului, nu unei relatii cu un tenant. Stocate ca hash — un dump al bazei nu trebuie sa fie o lista de treceri peste al doilea factor."
source = "ADR-021"

[[table]]
name = "user_session"
tenant_column = true
policy_shape = "self_row"
reason = "ARE tenant_id, dar nu pentru izolare: politica e `self_row`, iar coloana exista ca revocarea unui engagement sa poata gasi sesiunile firmei pentru ACEL client (IZ-20). Izolarea sesiunii vine din apartenenta la utilizator, nu din context."
source = "ADR-021; spec-a §4.3"

[[table]]
name = "document_event"
tenant_column = true
policy_shape = "tenant_predicate"
reason = "Istoricul de stari al documentelor. Append-only prin absenta grantului, ca `audit_event`: nu exista tranzitie legitima de modificat pe un rand de istoric. Distinct de audit — acela raspunde „cine ce a facut in sistem\", acesta „ce s-a intamplat cu acest document\"."
source = "R21; spec-a §1; infra/schema/append_only.toml"

[[table]]
name = "membership"
tenant_column = true
policy_shape = "self_row"
reason = "Citită de predicatele de acces. Politica e strict `user_id = app.current_user_id()`, neîncrucișată, ca să nu recurseze. Consecință: listarea membrilor unui tenant nu se face prin ORM — OD-37."
source = "ADR-003"

[[table]]
name = "company_access"
tenant_column = true
policy_shape = "self_row"
reason = "Idem `membership`."
source = "ADR-003"

# ── Read models ──────────────────────────────────────────────────────────────

[[table_pattern]]
pattern = "rm_*"
tenant_column = true
policy_shape = "readmodel_firm"
app_role_privileges = ["SELECT"]
reason = "Singurul strat unde interogarea cross-tenant e permisă. Filtrează pe `firm_id`, nu pe `tenant_id`. Scriere exclusiv prin calea privilegiată P-6."
source = "Amendament §A.10; spec-a §7.3"

# ── Infrastructură ───────────────────────────────────────────────────────────

[[table_pattern]]
pattern = "django_*"
tenant_column = false
policy_shape = "system"
reason = "Tabele de sistem Django: migrații, content types, sesiuni. Nu conțin date de business."
source = "implementation-spec §1.1"
