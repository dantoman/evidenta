# SNC „Stocuri" ca logică versionată — regula de absorbție a costurilor indirecte constante (pct. 30).
#
#     manage.py load_fiscal_parameters snc_stocuri.toml
#     manage.py activate_fiscal_parameters snc_stocuri.toml --approver <id>
#
# Formula e a actului: costurile constante intră în cost în baza capacității normale — integral
# când volumul efectiv o atinge, altfel proporțional cu raportul efectiv/normal, iar restul e
# cheltuieli curente. E logică (R17), nu parametru: se poate schimba prin ordin, iar recalcularea
# unei perioade trecute trebuie să folosească regula de atunci (R18). Implementările stau în
# `accounting.posting.absorption.IMPLEMENTATIONS`; rândul de mai jos spune care rulează.
#
# Actul: OMF nr. 118 din 06.08.2013 (SNC), cu cele două publicări — una comună cu OMF 119/2013,
# faptul care a cerut registrul de acte (OD-65). Intrare în vigoare 01.01.2014 (obligatoriu de la
# 01.01.2015); pct. 30 e text din 2013, rescris în formă prin OMF 48/2019 fără schimbare de fond
# (`c1-c3-c5-stocuri.md`).

