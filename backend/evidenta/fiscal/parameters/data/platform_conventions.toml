# Convențiile de platformă ca parametri fiscali — ADR-037 §0, §3.2; se încarcă prin
#
#     manage.py load_fiscal_parameters platform_conventions.toml
#
# sub rolul de date de referință (ADR-049, calea P-4). Fiecare rulare lasă un rând în
# `privileged_access_log`; a doua rulare a aceluiași fișier nu scrie nimic.
#
# `V1` A FOST CITITĂ (2026-08-29, `_input/cercetare/v1-factura-fiscala-omf-118-2017.md`):
# Ordinul MF nr. 118/2017, anexa nr. 1 (formularul) și anexa nr. 2 (Instrucțiunea) **tac** asupra
# numărului de zecimale — pentru preț, pentru sume și pentru cantitate. „Lei" din antetele
# coloanelor numește moneda, nu precizia. Tăcerea se consemnează, nu se interpretează.
#
# Deci valorile de mai jos NU sunt citite din act: sunt convenție de platformă (ADR-037 §6.2,
# opțiunea B — o singură convenție în motor), cu valoarea aleasă de proprietar — ipoteza lui de lucru
# din ADR-037 §0: patru zecimale la prețul unitar, două la sume. De aceea `confidence = "provisional"`
# cu motivul scris, și de aceea intră ca `draft`: activarea e actul proprietarului
# (`manage.py activate_fiscal_parameters platform_conventions.toml --approver <id>`).
#
# Cantitatea NU primește valoare aici: formularul tace, iar cine alege atunci — platformă, tenant
# sau unitate de măsură — e `OD-70`, deschisă. Un rând scris acum ar închide-o tacit.

