# Convențiile de platformă ca parametri fiscali — ADR-037 §0, §3.2; se încarcă prin
#
#     manage.py load_fiscal_parameters platform_conventions.toml
#
# sub rolul de date de referință (ADR-049, calea P-4). Fiecare rulare lasă un rând în
# `privileged_access_log`; a doua rulare a aceluiași fișier nu scrie nimic.
#
# `V1` A FOST CITITĂ (2026-08-29, `_input/cercetare/v1-factura-fiscala-omf-118-2017.md`):
# Ordinul MF nr. 118/2017, anexa nr. 1 (formularul) și anexa nr. 2 (Instrucțiunea) **tac** asupra
# numărului de zecimale — pentru preț, pentru sume și pentru cantitate. „Lei" din antetele
# coloanelor numește moneda, nu precizia. Tăcerea se consemnează, nu se interpretează.
#
# Deci valorile de mai jos NU sunt citite din act: sunt convenție de platformă (ADR-037 §6.2,
# opțiunea B — o singură convenție în motor), **aprobate de proprietar la 2026-08-29** cu motivele
# lui: două zecimale la sume e practica universală și nimic din act n-o contrazice; patru la prețul
# unitar acoperă cantitățile mari fără a pierde bani la înmulțire. `confidence = "provisional"`
# rămâne, cu motivul pe rând — acolo unde e citit, nu doar aici: convenții de platformă, nu
# prescripții legale; dacă apare vreodată o instrucțiune care le contrazice, se schimbă parametrul,
# nu structura. Intră ca `draft`; activarea e actul proprietarului
# (`manage.py activate_fiscal_parameters platform_conventions.toml --approver <id>`).
#
# Cantitatea NU e aici, și nu va fi: formularul tace, iar proprietarul a decis (ADR-055, OD-70)
# că precizia cantității e a unității de măsură — `unit_of_measure.decimal_places`, obligatorie,
# fără implicit. Nu vine dintr-un act, nu se schimbă prin lege, n-are `valid_from`: nu e parametru.
#
# Direcția de rotunjire la echidistanță (ADR-037 §3.3): `half_up`, aleasă de proprietar
# (2026-08-29). Motivele lui, pe scurt: e ce fac oamenii pe hârtie, ce face 1C și ce se așteaptă
# contabilul să vadă — clientul care verifică factura cu calculatorul trebuie să obțină același
# număr; `half_even` e mai bun statistic pe volume mari, dar avantajul e invizibil în contabilitate
# (sute de linii verificate manual, nu milioane de rotunjiri independente), iar 2,5 → 2 și 3,5 → 4
# arată ca o eroare pentru oricine nu cunoaște regula; unde legislația fiscală prescrie explicit o
# metodă, e aproape întotdeauna half_up — actul tace, dar tăcerea nu e motiv să alegi convenția
# neobișnuită. Tot convenție de platformă, cu același motiv ca celelalte două: formularul tace.

