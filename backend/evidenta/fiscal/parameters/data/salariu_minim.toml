# Salariul minim pe țară — `labour.minimum_wage_monthly` — încărcat și activat pe delegarea
# proprietarului din 2026-09-03 („if needed my decision... just do it on my behalf").
#
#     manage.py load_fiscal_parameters salariu_minim.toml
#     manage.py activate_fiscal_parameters salariu_minim.toml --approver <user id>
#
# DE CE EXISTĂ: `13-lista-de-deblocare.md` §C12 — parametrul lipsea cu totul, iar art. 22 alin. (1)
# din Legea 489/1999 cere ca baza CAS să nu fie sub salariul minim, proporţional timpului lucrat
# (`payroll/services/runs.py`, `_minimum_base`). Fără el linia CAS iese fără sumă şi rularea nu se
# poate aproba.
#
# SURSA: proiectul HG „Privind stabilirea cuantumului salariului minim pe ţară pentru anul 2026"
# (NU-915-MMPS-2025, gov.md, şedinţa din 17.12.2025), citit din PDF-ul redactat: pct. 1 —
# „Se stabileşte, începând cu 1 ianuarie 2026, salariul minim pe ţară în cuantum de 6300 de lei
# lunar pentru un program complet de lucru de 169 de ore (în medie pe lună), ceea ce reprezintă
# 37,28 lei pe oră."; pct. 2 — „Prezenta hotărâre intră în vigoare la data de 1 ianuarie 2026."
# Temeiul: art. 3 din Legea nr. 1432/2000. Identitatea actului adoptat — HG nr. 771 din
# 17.12.2025, publicată în MO la 18.12.2025 — vine din indexul legis.md (doc_id=152064) şi din
# monitorul.fisc.md; textul adoptat nu s-a citit (legis.md 403), de aceea `provisional`, iar
# numărul şi poziţia din MO nu sunt afirmate.
#
# CE NU E AICI: cuantumul pentru 2025 (5500 lei, afirmat de comunicatul gov.md) — actul lui nu e
# identificat; norma lunară de 169 de ore nu e parametru scalar aici, `Timesheet.norm_hours` o
# poartă per lună.

