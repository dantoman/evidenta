# CNAS și CNAM — cotele, majorarea de întârziere, prima fixă, salariul mediu prognozat — ca `draft`.
#
#     manage.py load_fiscal_parameters cnas_cnam.toml
#
# `F2.X1` (09-f2-backlog.md), instrucțiunea proprietarului din 2026-08-30: **se încarcă, nu se
# activează.** Activarea rămâne actul lui (`activate_fiscal_parameters cnas_cnam.toml --approver`).
#
# SURSA fiecărei cifre: `_input/cercetare/od-22-cnas-cnam.md` (26.08.2026) — reproducerea actelor de
# către CNAS și SFS, nu textul din Monitorul Oficial; de aceea fiecare rând e `provisional`, cu motivul
# pe rând. Ce lipsește ca un rând să poată deveni `confirmed` e identitatea MO a actelor de bază —
# adusă parțial de `f2-x1-identitatile-actelor.md` (30.08.2026): legile de bază au MO doar din citări oficiale, fără pagina ediției.
#
# ANCORAREA, spusă deschis: cotele CAS stau permanent în anexa nr. 1 la Legea nr. 489/1999, iar CNAM
# în anexa nr. 1 la Legea nr. 1593/2002 — legea anuală a bugetului doar le aplică (cercetare, §0).
# Identitatea celor două legi de bază (data, MO, intrarea în vigoare a formei curente a anexei) NU
# s-a obținut, iar încărcătorul cere `effective_from` pe act. Rândurile de mai jos sunt deci ancorate
# în legea anuală care le aplică pentru primul an din fereastra cercetată (2024), cu inferența
# marcată; când identitatea legii de bază sosește, rândul se re-ancorează (rândurile `draft` se
# actualizează la reîncărcare; cele `active` nu — R15).
#
# CE NU E AICI, deliberat: categoriile de plătitori pe care o companie de servicii nu le are —
# aviația (pct. 1.2), agricultura (1.5, cu compensarea de 6%), parcurile IT (1.4), antreprenorii
# independenți (1.10), zilierii (1.9), taxele fixe ale fondatorilor ÎI și ale liber-profesioniștilor
# (1.6–1.8), primele CNAM reduse pentru asigurații individuali. Intră când un client le cere, cu
# aceeași citare. Contribuția individuală CAS (0% din 01.01.2021, Legea nr. 60/2020, MO 108-109 din
# 25.04.2020, poz. 186) are rând de la a doua încărcare (30.08.2026), când `f2-x1-identitatile-actelor.md`
# a adus data legii (23.04.2020). CNAM pentru 2024 și 2025 (L. 420/2023, L. 304/2024) — aceleași
# valori, datele actelor lipsesc încă.
#
# VOCABULARUL CHEILOR e propus aici și se confirmă în `F2.B0` (ADR-ul schemei de salarizare).
# Asimetria structurală din cercetare e păstrată în chei: CAS e obligație a angajatorului
# (cheltuială), CNAM e reținere din salariat — nu „cotă angajator + cotă angajat" pe același tipar.

