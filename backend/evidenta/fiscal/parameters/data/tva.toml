# TVA — vocabularul regimurilor, cotele, pragul de înregistrare, termenul declarației — ca `draft`.
#
#     manage.py load_fiscal_parameters tva.toml
#
# `F2.X1`, instrucțiunea proprietarului din 2026-08-30: **se încarcă, nu se activează.** Amânat la
# prima încărcare fiindcă ancora — Codul fiscal — n-avea dată de intrare în vigoare în nicio
# cercetare; `f2-x1-identitatile-actelor.md` (30.08.2026) a adus clauza, citită verbatim din textul
# MF al Legii nr. 1417-XIII din 17.12.1997, art. 1: „Titlul III al Codului fiscal intră în vigoare la
# 1 iulie 1998."
#
# SURSA valorilor: `_input/cercetare/od-22-tva.md` (26.08.2026) — reproducerea Codului de către SFS
# (BGPF, ordine SFS datate), nu textul din MO; de aceea `provisional`, cu motivul pe rând. Ferestrele
# `valid_from` NU pretind istoric dinainte de perioada cercetată (2024–2026): cota de 20% e
# „neschimbată în perioada cercetată", nu „din 1998" — un `valid_from` mai vechi ar fi o afirmație pe
# care nimeni n-a citit-o.
#
# CE NU E AICI, cu motivul: pragul de 1 500 000 lei (01.01–28.02.2026) și cel de 1 200 000 lei (până
# la 31.12.2025) — actele lor nu sunt identificate cu certitudine (od-22-tva.md, „Ce nu s-a putut
# verifica", pct. 6); lista scutirilor art. 103 — structura e din 2020 cu delte, nu textul curent
# (pct. 5), și e listă, nu parametru scalar (DNB-06 deschisă); proratarea (art. 102 alin. (4)) e
# logică versionată (`F2.A6`), cu rotunjirea ei ca parametru când Legea 60/2020 primește clauza de
# intrare în vigoare; perioada fiscală „luna" — neverificată verbatim (pct. 3), iar `VatPeriod` o
# poartă deja structural (ADR-039 §7).
#
# VOCABULARUL REGIMURILOR e convenție de platformă peste categoriile Codului — codurile sunt ale
# noastre, categoriile ale actului: art. 96 lit. a) și b), art. 103 (scutite fără drept de deducere),
# art. 104 (scutite cu drept de deducere — fosta „cotă zero", eliminată ca literă a art. 96 la o dată
# neconfirmată). `vat.py` citește cheia `vat.regimes` ca tabel de coduri; `F2.A0`/`F2.A6` pot lărgi
# lista (livrări care nu sunt obiect impozabil, taxare inversă) cu articolul citit.
#
# `rates` (pasul 6, ADR-089) leagă un regim de PARAMETRUL de cotă pe care îl rezolvă, nu de o
# valoare: `taxable_standard` → `vat.standard`, iar cota vine din rândul acela, la data faptului.
# Un regim absent din `rates` nu poartă cotă — TVA zero pe linie, fără cheie — și asta e tot ce spune
# lipsa lui: dreptul de deducere al scutirilor (art. 103 vs art. 104) nu se citește de aici, e al
# registrelor și al proratării.

