# Impozitul pe venit reținut din salariu — cota, scutirile, plafonul — ca `draft`.
#
#     manage.py load_fiscal_parameters impozit_pe_venit.toml
#
# `F2.X1`, instrucțiunea proprietarului din 2026-08-30: **se încarcă, nu se activează.**
#
# SURSA: `_input/cercetare/od-22-impozitul-pe-venit.md` (26.08.2026) — Baza generalizată a practicii
# fiscale a SFS, care reproduce Codul fiscal; nu textul din MO. De aceea `provisional`, cu motivul pe
# rând. Regula din ADR-045 e respectată în chei: cuantumurile vin din Codul fiscal (art. 15, 33–35),
# niciodată din HG 697/2014, care e procedură — și care încă trimite la o scutire ce nu se acordă.
#
# Actele modificatoare au aici identitatea MO completă (cercetarea le-a citit): Legea nr. 178/2018
# (cota unică), Legea nr. 214/2024 (scutirile 2025), Legea nr. 318/2025 (modificările 2026). Codul
# fiscal însuși (Legea nr. 1163/1997) nu e ancoră aici, fiindcă data intrării lui în vigoare nu e în
# cercetare; vine cu `f2-x1-identitatile-actelor.md`.
#
# CE NU E AICI: scutirile pe 2024 (actul care le-a stabilit nu e identificat); cota persoanelor
# juridice (VEN12 e întrebare de scop pentru proprietar — 09-f2-backlog.md §„Întrebări"); regimurile
# speciale (zilieri, parcuri IT, taxi, antreprenori independenți).
#
# VOCABULARUL CHEILOR e propus și se confirmă în `F2.B0`. Codurile scutirilor din cercetare (P, M,
# Sm, N, H) stau în nume; `S` — scutirea ordinară de soț/soție — are rând cu valoarea 0 tocmai ca să
# nu fie inventată: art. 34 alin. (1) nu se acordă (capcana din cercetare §2).

